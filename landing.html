<title>ระบบประเมินคุณภาพผลงานวิจัยของคุรุสภา</title>

<style>
:root{
  --bg:#F7F9FC;
  --card:#FFFFFF;
  --blue:#1B4B91;
  --blue-2:#2E6BB8;
  --orange:#E8722C;
  --orange-light:#FCE6D3;
  --green:#3F7857;
  --green-bg:#E7F1EA;
  --red:#B5473A;
  --red-bg:#FBEAE7;
  --text:#24272E;
  --muted:#767A82;
  --border:#E1E6EE;
  --teal:#0F766E;
  --teal-bg:#E3F4F1;
  --purple:#6D28D9;
  --purple-bg:#F0E9FE;
  --slate:#475569;
  --slate-bg:#EEF1F4;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Mali','Noto Sans Thai','Noto Sans',sans-serif;
  min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 60px;}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:16px 20px;font-size:13px;color:var(--muted);}
.topbar .who{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;}
.topbar a{color:var(--blue-2);text-decoration:underline;cursor:pointer;}
.hero{
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-2) 100%);
  border-radius:18px;padding:36px 30px;color:#fff;text-align:center;margin-bottom:28px;
}
.hero img{height:88px;width:auto;object-fit:contain;margin-bottom:10px;}
.hero h1{font-family:'Mali','Noto Serif Thai',serif;font-size:24px;margin:6px 0 4px;font-weight:700;}
.hero p{margin:0;font-size:14px;opacity:.92;}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;}
.login-card{max-width:400px;margin:0 auto;}
.login-card h2{font-size:18px;margin:0 0 18px;text-align:center;}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
input[type=text],input[type=email],input[type=password]{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:15px;background:#FAFBFD;
}
input:focus{outline:2px solid var(--blue-2);outline-offset:1px;}
.btn{
  width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;
  background:var(--blue);color:#fff;font-family:inherit;font-size:15px;font-weight:600;
  cursor:pointer;
}
.btn:hover{background:var(--blue-2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-row-save{width:auto;margin:0;padding:6px 14px;font-size:13px;font-weight:600;}
.btn-row-save.dirty{background:var(--orange);color:#fff;border:1px solid var(--orange);}
.btn-row-save:not(.dirty){background:#fff;color:var(--muted);border:1px solid var(--border);}
.err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:14px;}
.info{background:var(--orange-light);color:#8A4A18;border-radius:10px;padding:12px 14px;font-size:13.5px;margin:16px 0;}

.icon-menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:480px){.icon-menu{grid-template-columns:1fr;}}
.icon-tile{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:30px 16px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s;
  text-decoration:none;color:inherit;display:block;
}
.icon-tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(27,75,145,.10);}
.icon-tile.full{grid-column:1/-1;}
.icon-circle{
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
}
.icon-circle svg{width:28px;height:28px;}
.icon-tile h3{margin:0;font-size:16px;font-weight:600;}
.icon-tile p{margin:6px 0 0;font-size:12.5px;color:var(--muted);}

.section-title{font-size:15px;font-weight:700;margin:26px 0 12px;color:var(--text);}
.toast{font-size:13.5px;margin-top:10px;}
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.admin-row:last-child{border-bottom:none;}
.admin-row .em{font-size:13px;color:var(--muted);}
.chk-group{display:flex;gap:14px;font-size:13px;align-items:center;}
.chk-group label{display:flex;align-items:center;gap:5px;margin:0;color:var(--text);font-size:13px;}
.back-link{display:inline-block;margin-bottom:16px;color:var(--blue-2);text-decoration:none;font-size:14px;cursor:pointer;}
.back-link:hover{text-decoration:underline;}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:70px;}
.pass-toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--blue-2);font-size:12.5px;font-family:inherit;
  cursor:pointer;padding:4px 6px;width:auto;margin:0;
}
</style>
</head>

/* ===================== kvstore helpers (landing: prefix) ===================== */
async function kvGet(key){
  const snap = await fsDb.collection('kvstore').doc(key).get();
  return snap.exists ? snap.data() : null;
}
async function kvSet(key, value){
  await fsDb.collection('kvstore').doc(key).set({ value: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
}

async function loadLandingSuperAdmins(){
  try{ const r = await kvGet('landing:superadmins'); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveLandingSuperAdmins(arr){ await kvSet('landing:superadmins', JSON.stringify(arr)); }

async function loadLandingPermissions(){
  try{ const r = await kvGet('landing:permissions'); return r ? JSON.parse(r.value) : {}; }
  catch(e){ return {}; }
}
async function saveLandingPermissions(obj){ await kvSet('landing:permissions', JSON.stringify(obj)); }

async function loadLandingUsernameMap(){
  try{ const r = await kvGet('landing:usernameMap'); return r ? JSON.parse(r.value) : {}; }
  catch(e){ return {}; }
}
async function saveLandingUsernameMap(obj){ await kvSet('landing:usernameMap', JSON.stringify(obj)); }

/* ===================== state ===================== */
let superAdmins = [];
let permissions = {};
let usernameMap = {}; // username(lowercase) -> email, for login-by-username and friendly display
let currentUser = null;

function cleanInput(s){
  return (s==null ? '' : s).normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
}
/* If someone mixes up the "email" and "username" boxes (a common slip — e.g. typing
   the email into the username field and vice versa), this detects it from the "@"
   and swaps them back automatically instead of just failing with a validation error. */
function autoFixEmailUsername(email, username){
  const emailHasAt = email.includes('@');
  const usernameHasAt = username.includes('@');
  if(!emailHasAt && usernameHasAt){
    return { email: username, username: email, swapped: true };
  }
  return { email, username, swapped: false };
}
/* Accepts either a username or a raw email at login. Returns the real email to
   authenticate with, or null if a username was given but not found. */
function resolveLoginEmail(input){
  const v = (input||'').trim();
  if(!v) return null;
  if(v.includes('@')) return v;
  const hit = usernameMap[v.toLowerCase()];
  return hit || null;
}
function usernameForEmail(email){
  if(!email) return null;
  const found = Object.entries(usernameMap).find(([u,e])=> e.toLowerCase()===email.toLowerCase());
  return found ? found[0] : null;
}
function displayNameForEmail(email){
  return usernameForEmail(email) || email;
}

function escapeHtml(s){
  return (s==null ? '' : String(s)).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function isSuperAdmin(email){
  if(!email) return false;
  if(superAdmins.length===0) return true; // bootstrap: no superadmin set yet
  return superAdmins.some(e=>e.toLowerCase()===email.toLowerCase());
}

const root = document.getElementById('root');
const topbar = document.getElementById('topbar');
const whoSpan = document.getElementById('whoSpan');
document.getElementById('logoutLink').onclick = async ()=>{ await fsAuth.signOut(); };

/* ===================== render: login ===================== */
function renderLogin(){
  topbar.style.display = 'none';
  root.innerHTML = `
    <div class="card login-card">
      <h2>เข้าสู่ระบบ</h2>
      <label>ชื่อผู้ใช้ หรือ อีเมล</label>
      <input type="text" id="loginEmail" placeholder="ชื่อผู้ใช้ หรือ name@example.com">
      <label>รหัสผ่าน</label>
      <div class="pass-wrap">
        <input type="password" id="loginPass" placeholder="รหัสผ่าน">
        <button type="button" class="pass-toggle" id="toggleLoginPass">แสดง</button>
      </div>
      <button class="btn" id="loginBtn">เข้าสู่ระบบ</button>
      <div class="err" id="loginErr" style="display:none;"></div>
    </div>
  `;
  const toggleLoginPass = document.getElementById('toggleLoginPass');
  const loginPassInput = document.getElementById('loginPass');
  toggleLoginPass.onclick = ()=>{
    const showing = loginPassInput.type === 'text';
    loginPassInput.type = showing ? 'password' : 'text';
    toggleLoginPass.textContent = showing ? 'แสดง' : 'ซ่อน';
  };
  document.getElementById('loginBtn').onclick = async ()=>{
    const rawInput = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';
    if(!rawInput || !pass){
      errEl.textContent = 'กรุณากรอกชื่อผู้ใช้/อีเมล และรหัสผ่าน';
      errEl.style.display = 'block';
      return;
    }
    // ต้องโหลด usernameMap ให้พร้อมก่อนแปลงชื่อผู้ใช้เป็นอีเมล (หน้า login แสดงก่อน auth
    // state จะรู้ผล จึงยังไม่เคยโหลดค่านี้มาก่อนหน้านี้)
    if(Object.keys(usernameMap).length===0){
      try{ usernameMap = await loadLandingUsernameMap(); }catch(e){}
    }
    const email = resolveLoginEmail(rawInput);
    if(!email){
      errEl.textContent = 'ไม่พบชื่อผู้ใช้นี้ในระบบ กรุณาตรวจสอบอีกครั้ง หรือลองใช้อีเมลแทน';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
    try{
      await fsAuth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged จะจัดการ render ต่อเอง
    }catch(err){
      errEl.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบชื่อผู้ใช้/อีเมลและรหัสผ่าน';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }
  };
}

  const cards = [];

    cards.push(`

        <div class="icon-circle" style="background:var(--teal-bg);color:var(--teal);">${ICON_MAPPIN}</div>

        <p>ระดับภูมิภาค</p>

  }
  if(myPerm.national){
    cards.push(`
      <a class="icon-tile" href="${NATIONAL_URL}">
        <div class="icon-circle" style="background:var(--purple-bg);color:var(--purple);">${ICON_AWARD}</div>
        <h3>การประเมินผลงานวิจัย</h3>
        <p>ระดับประเทศ</p>
      </a>`);
  }
  if(amSuper){
    cards.push(`
      <div class="icon-tile full" id="goAdmin">
        <div class="icon-circle" style="background:var(--slate-bg);color:var(--slate);">${ICON_SHIELD}</div>
        <h3>การดูแลระบบ</h3>
        <p>จัดการผู้ดูแลระบบและสิทธิ์การเข้าถึง</p>
      </div>`);
  }

  if(cards.length===0){
    root.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="info" style="margin:0;">ยังไม่ได้รับสิทธิ์เข้าใช้งานระบบใด กรุณาติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์</div>
      </div>`;
    return;
  }

  root.innerHTML = `<div class="icon-menu">${cards.join('')}</div>`;
  const adminTile = document.getElementById('goAdmin');
  if(adminTile) adminTile.onclick = renderAdminPanel;
}

      </div>
      <div class="chk-group" style="margin-top:14px;">
        <label><input type="checkbox" id="permRegional"> เห็นระบบภูมิภาค</label>
        <label><input type="checkbox" id="permNational"> เห็นระบบประเทศ</label>
      </div>
      <button class="btn" id="addAdminBtn">เพิ่มผู้ดูแลระบบ</button>
      <div class="toast" id="addAdminToast"></div>
    </div>

    <div class="section-title">ผู้ดูแลระบบทั้งหมด</div>
    <div class="card" id="adminListCard"><div class="toast">กำลังโหลด...</div></div>

    <div class="section-title">สิทธิ์ "การดูแลระบบ" (ซูเปอร์แอดมิน)</div>
    <div class="card">
      <div class="info" style="margin-top:0;">${superAdmins.length===0 ? 'ยังไม่ได้กำหนดซูเปอร์แอดมิน ผู้ดูแลระบบทุกคนเข้าหน้านี้ได้ชั่วคราว จนกว่าจะเพิ่มรายชื่อแรกด้านล่าง' : ''}</div>
      <label>อีเมลที่จะให้สิทธิ์ซูเปอร์แอดมิน</label>
      <input type="email" id="newSuperEmail" placeholder="name@example.com">
      <button class="btn btn-outline" id="addSuperBtn">เพิ่มสิทธิ์</button>
      <div class="toast" id="addSuperToast"></div>
      <div id="superList" style="margin-top:14px;"></div>
    </div>

    <div class="section-title">ตรวจสอบข้อมูลเชื่อมโยง ภูมิภาค → ประเทศ</div>
    <div class="card" id="linkageInspectionCard"><div class="toast">กำลังโหลด...</div></div>
  `;
  document.getElementById('backLink').onclick = renderMenu;
  const togglePass = document.getElementById('togglePass');
  const newPassInput = document.getElementById('newPass');
  togglePass.onclick = ()=>{
    const showing = newPassInput.type === 'text';
    newPassInput.type = showing ? 'password' : 'text';
    togglePass.textContent = showing ? 'แสดง' : 'ซ่อน';
  };
  renderAdminList();
  renderSuperList();
  renderLinkageInspectionPanel();

  document.getElementById('addAdminBtn').onclick = async ()=>{
    let username = cleanInput(document.getElementById('newUsername').value);
    let email = cleanInput(document.getElementById('newEmail').value);
    const pass = document.getElementById('newPass').value;
    const wantRegional = document.getElementById('permRegional').checked;
    const wantNational = document.getElementById('permNational').checked;
    const toast = document.getElementById('addAdminToast');
    const btn = document.getElementById('addAdminBtn');
    if(!username || !email || !pass){ toast.style.color='var(--red)'; toast.textContent='กรุณากรอกชื่อผู้ใช้ อีเมล และรหัสผ่านให้ครบ'; return; }
    const fixedAdmin = autoFixEmailUsername(email, username);
    email = fixedAdmin.email; username = fixedAdmin.username;
    if(pass.length<6){ toast.style.color='var(--red)'; toast.textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return; }
    if(!wantRegional && !wantNational){ toast.style.color='var(--red)'; toast.textContent='กรุณาเลือกอย่างน้อย 1 ระบบที่ให้สิทธิ์เข้าถึง'; return; }
    if(usernameMap[username.toLowerCase()]){ toast.style.color='var(--red)'; toast.textContent='มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาตั้งชื่ออื่น'; return; }
    btn.disabled = true; btn.textContent = 'กำลังเพิ่ม...';
    let secondaryApp = null;
    let accountAlreadyExisted = false;
    try{
      secondaryApp = firebase.initializeApp(firebaseConfig, 'adminCreate_' + Date.now());
      try{
        await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
        await secondaryApp.auth().signOut();
      }catch(createErr){
        if(createErr && createErr.code === 'auth/email-already-in-use'){
          // บัญชีนี้มี Firebase Auth อยู่แล้ว (เช่น สร้างไว้จากระบบภูมิภาค/ประเทศเดิม) —
          // ไม่ต้องสร้างซ้ำ แค่บันทึกสิทธิ์ landing permissions ให้ต่อได้เลย
          accountAlreadyExisted = true;
        } else {
          throw createErr;
        }
      }
      usernameMap[username.toLowerCase()] = email;
      await saveLandingUsernameMap(usernameMap);
      permissions[email.toLowerCase()] = { regional: wantRegional, national: wantNational };
      await saveLandingPermissions(permissions);
      toast.style.color = 'var(--green)';
      toast.textContent = accountAlreadyExisted
        ? `บันทึกสิทธิ์ให้ ${username} แล้ว (ใช้บัญชีเดิมที่มีอยู่แล้ว ไม่ได้สร้างรหัสผ่านใหม่)`
        : `เพิ่มผู้ดูแลระบบ ${username} สำเร็จแล้ว แจ้งรหัสผ่านนี้ให้ผู้ใช้ไปเปลี่ยนเองภายหลัง`;
      document.getElementById('newUsername').value='';
      document.getElementById('newEmail').value='';
      document.getElementById('newPass').value='';
      document.getElementById('permRegional').checked=false;
      document.getElementById('permNational').checked=false;
      renderAdminList();
    }catch(err){
      toast.style.color = 'var(--red)';
      toast.textContent = 'เพิ่มผู้ดูแลระบบไม่สำเร็จ กรุณาลองใหม่';
    }
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(e){} }
    btn.disabled = false; btn.textContent = 'เพิ่มผู้ดูแลระบบ';
  };

  document.getElementById('addSuperBtn').onclick = async ()=>{
    const email = document.getElementById('newSuperEmail').value.trim();
    const toast = document.getElementById('addSuperToast');
    if(!email){ toast.style.color='var(--red)'; toast.textContent='กรุณากรอกอีเมล'; return; }
    if(superAdmins.some(e=>e.toLowerCase()===email.toLowerCase())){
      toast.style.color='var(--red)'; toast.textContent='อีเมลนี้มีสิทธิ์อยู่แล้ว'; return;
    }
    superAdmins.push(email);
    await saveLandingSuperAdmins(superAdmins);
    toast.style.color='var(--green)'; toast.textContent=`เพิ่มสิทธิ์ให้ ${email} แล้ว`;
    document.getElementById('newSuperEmail').value='';
    renderSuperList();
    renderAdminPanel(); // รีเฟรชข้อความ bootstrap ด้านบนถ้าเปลี่ยนสถานะ
  };
}

let pendingPermissions = {};

function renderAdminList(){
  const el = document.getElementById('adminListCard');
  const emails = Object.keys(permissions);
  if(emails.length===0){ el.innerHTML = '<div class="toast" style="color:var(--muted);">ยังไม่มีผู้ดูแลระบบ</div>'; return; }
  // pendingPermissions เก็บค่าที่ติ๊กไว้ในหน้าจอ (ยังไม่มีผลจริง) แยกจาก permissions ซึ่งเป็นค่าที่บันทึกจริงแล้ว
  pendingPermissions = {};
  emails.forEach(email=>{ pendingPermissions[email] = { ...permissions[email] }; });

  el.innerHTML = emails.map(email=>{
    const p = permissions[email];
    const uname = usernameForEmail(email);
    return `
      <div class="admin-row" data-row-email="${email}">
        <div>
          <div data-role="display">${uname || email}</div>
          ${uname ? `<div style="font-size:12px;color:var(--muted);">${email}</div>` : ''}
          <div class="username-edit" data-role="edit" style="display:none;margin-top:8px;">
            <input type="text" class="uname-input" data-email="${email}" placeholder="ตั้งชื่อผู้ใช้" value="${uname||''}" style="margin-bottom:6px;">
            <button class="btn btn-outline btn-uname-save" data-email="${email}" style="padding:4px 12px;font-size:13px;">บันทึกชื่อผู้ใช้</button>
            <a class="back-link btn-uname-cancel" data-email="${email}" style="margin:0 0 0 10px;font-size:13px;">ยกเลิก</a>
            <div class="toast" data-role="unameToast" style="margin-top:4px;"></div>
          </div>
          <a class="back-link btn-uname-toggle" data-email="${email}" style="margin:6px 0 0;font-size:12.5px;">${uname ? 'แก้ไขชื่อผู้ใช้' : '+ ตั้งชื่อผู้ใช้'}</a>
        </div>
        <div class="chk-group">
          <label><input type="checkbox" data-email="${email}" data-field="regional" ${p.regional?'checked':''}> ภูมิภาค</label>
          <label><input type="checkbox" data-email="${email}" data-field="national" ${p.national?'checked':''}> ประเทศ</label>
          <button class="btn btn-row-save" data-saverow="${email}" disabled>บันทึก</button>
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('.btn-uname-toggle').forEach(a=>{
    a.onclick = ()=>{
      const row = el.querySelector(`.admin-row[data-row-email="${a.dataset.email}"]`);
      row.querySelector('[data-role="display"]').style.display = 'none';
      row.querySelector('[data-role="edit"]').style.display = 'block';
      a.style.display = 'none';
    };
  });
  el.querySelectorAll('.btn-uname-cancel').forEach(a=>{
    a.onclick = ()=> renderAdminList();
  });
  el.querySelectorAll('.btn-uname-save').forEach(btn=>{
    btn.onclick = async ()=>{
      const email = btn.dataset.email;
      const row = el.querySelector(`.admin-row[data-row-email="${email}"]`);
      const input = row.querySelector('.uname-input');
      const toast = row.querySelector('[data-role="unameToast"]');
      const newUsername = cleanInput(input.value).toLowerCase();
      const oldUsername = usernameForEmail(email);
      toast.textContent = '';
      if(!newUsername){ toast.style.color='var(--red)'; toast.textContent='กรุณากรอกชื่อผู้ใช้'; return; }
      if(usernameMap[newUsername] && usernameMap[newUsername].toLowerCase()!==email.toLowerCase()){
        toast.style.color='var(--red)'; toast.textContent='มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาตั้งชื่ออื่น'; return;
      }
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      if(oldUsername) delete usernameMap[oldUsername.toLowerCase()];
      usernameMap[newUsername] = email;
      await saveLandingUsernameMap(usernameMap);
      renderAdminList();
    };
  });

  function updateRowButton(email){
    const btn = el.querySelector(`button[data-saverow="${email}"]`);
    const isDirty = JSON.stringify(pendingPermissions[email]) !== JSON.stringify(permissions[email]);
    btn.disabled = !isDirty;
    btn.classList.toggle('dirty', isDirty);
    btn.textContent = isDirty ? 'บันทึกการเปลี่ยนแปลง' : 'บันทึก';
  }

  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const email = cb.dataset.email, field = cb.dataset.field;
      pendingPermissions[email][field] = cb.checked;
      updateRowButton(email);
    };
  });

  el.querySelectorAll('button[data-saverow]').forEach(btn=>{
    btn.onclick = async ()=>{
      const email = btn.dataset.saverow;
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';
      permissions[email] = { ...pendingPermissions[email] };
      await saveLandingPermissions(permissions);
      btn.textContent = 'บันทึกแล้ว ✓';
      btn.classList.remove('dirty');
      setTimeout(()=>{ btn.textContent = 'บันทึก'; btn.disabled = true; }, 1500);
    };
  });
}

function renderSuperList(){
  const el = document.getElementById('superList');
  if(superAdmins.length===0){ el.innerHTML=''; return; }
  el.innerHTML = superAdmins.map(email=>`
    <div class="admin-row">
      <div class="em">${displayNameForEmail(email)}</div>
      <a class="back-link" style="margin:0;color:var(--red);" data-email="${email}">ถอดสิทธิ์</a>
    </div>`).join('');
  el.querySelectorAll('a[data-email]').forEach(a=>{
    a.onclick = async ()=>{
      superAdmins = superAdmins.filter(e=>e.toLowerCase()!==a.dataset.email.toLowerCase());
      await saveLandingSuperAdmins(superAdmins);
      renderSuperList();
      renderAdminPanel();
    };
  });
}

/* ===================== ตรวจสอบข้อมูลเชื่อมโยง ภูมิภาค → ประเทศ =====================
   อ่านทะเบียนกลาง link:regionalPullIndex (single source of truth ที่ตกลงกันไว้ตอนออกแบบ
   ฟีเจอร์ดึงผลงาน) โดยตรงจาก client — ใช้ได้เพราะ Firestore rule เปิด read:true ทุกจุด */
async function loadRegionalPullIndexForInspection(){
  try{ const r = await kvGet('link:regionalPullIndex'); return r ? JSON.parse(r.value) : {}; }
  catch(e){ return {}; }
}
async function saveRegionalPullIndexForInspection(idx){
  await kvSet('link:regionalPullIndex', JSON.stringify(idx));
}
async function loadRegionalGroupsForInspection(){
  try{ const r = await kvGet('regional:groups'); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}

let linkageEntriesCache = [];

async function renderLinkageInspectionPanel(){
  const card = document.getElementById('linkageInspectionCard');
  card.innerHTML = `<div class="toast">กำลังโหลดข้อมูลเชื่อมโยง...</div>`;

  const [pullIndex, regionalGroups] = await Promise.all([
    loadRegionalPullIndexForInspection(),
    loadRegionalGroupsForInspection()
  ]);
  const yearByRegionalGroupId = {};
  regionalGroups.forEach(g=>{ yearByRegionalGroupId[g.id] = g.year || ''; });

  linkageEntriesCache = Object.entries(pullIndex).map(([regionalWorkId, entry])=>({
    regionalWorkId,
    ...entry,
    year: yearByRegionalGroupId[entry.regionalGroupId] || ''
  }));

  if(linkageEntriesCache.length===0){
    card.innerHTML = `<div class="toast" style="color:var(--muted);">ยังไม่มีผลงานที่ถูกดึงจากภูมิภาคเข้าสู่ระดับประเทศ</div>`;
    return;
  }

  const years = [...new Set(linkageEntriesCache.map(x=>x.year).filter(y=>y))].sort((a,b)=>b.localeCompare(a));
  const regionalGroupNames = [...new Set(linkageEntriesCache.map(x=>x.regionalGroupName))].sort();
  const nationalGroupNames = [...new Set(linkageEntriesCache.map(x=>x.nationalGroupName))].sort();

  card.innerHTML = `
    <div style="display:flex;gap:14px;flex-wrap:wrap;">
      <div style="flex:1;min-width:140px;">
        <label>ปี</label>
        <select id="linkYearFilter">
          <option value="__all__">ทั้งหมด</option>
          ${years.map(y=>`<option value="${escapeHtml(y)}">ปี ${escapeHtml(y)}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1;min-width:180px;">
        <label>กลุ่มภูมิภาค</label>
        <select id="linkRegionalGroupFilter">
          <option value="__all__">ทั้งหมด</option>
          ${regionalGroupNames.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1;min-width:180px;">
        <label>กลุ่มประเทศ</label>
        <select id="linkNationalGroupFilter">
          <option value="__all__">ทั้งหมด</option>
          ${nationalGroupNames.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
        </select>
      </div>
    </div>
    <label>ค้นหารหัสผลงาน/ชื่อผู้วิจัย</label>
    <input type="text" id="linkSearchInput" placeholder="พิมพ์เพื่อค้นหา...">
    <div id="linkageListWrap" style="margin-top:14px;"></div>
  `;
  ['linkYearFilter','linkRegionalGroupFilter','linkNationalGroupFilter'].forEach(id=>{
    document.getElementById(id).onchange = renderLinkageList;
  });
  document.getElementById('linkSearchInput').oninput = renderLinkageList;
  renderLinkageList();
}

function renderLinkageList(){
  const wrap = document.getElementById('linkageListWrap');
  const yearF = document.getElementById('linkYearFilter').value;
  const rGroupF = document.getElementById('linkRegionalGroupFilter').value;
  const nGroupF = document.getElementById('linkNationalGroupFilter').value;
  const search = document.getElementById('linkSearchInput').value.trim().toLowerCase();

  const filtered = linkageEntriesCache.filter(x=>{
    if(yearF!=='__all__' && x.year!==yearF) return false;
    if(rGroupF!=='__all__' && x.regionalGroupName!==rGroupF) return false;
    if(nGroupF!=='__all__' && x.nationalGroupName!==nGroupF) return false;
    if(search){
      const hay = `${x.workTitle} ${x.presenter}`.toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  if(filtered.length===0){
    wrap.innerHTML = `<div class="toast" style="color:var(--muted);">ไม่พบรายการที่ตรงกับตัวกรอง</div>`;
    return;
  }

  wrap.innerHTML = `<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">พบทั้งหมด ${filtered.length} รายการ</p>` +
    filtered.map(x=>{
      const dateStr = x.pulledAt ? new Date(x.pulledAt).toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' }) : 'ไม่ทราบวันที่';
      return `
      <div class="admin-row" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div>
          <strong>${escapeHtml(x.workTitle)}</strong> — ${escapeHtml(x.presenter||'-')}
          <div style="font-size:12px;color:var(--muted);">
            ต้นทาง: ${escapeHtml(x.regionalGroupName)}${x.year ? ' (ปี '+escapeHtml(x.year)+')' : ''}
            &nbsp;→&nbsp; ปลายทาง: ${escapeHtml(x.nationalGroupName)}
          </div>
          <div style="font-size:12px;color:var(--muted);">
            คะแนน ณ ตอนดึง ${x.regionalScoreAtPull!=null ? x.regionalScoreAtPull.toFixed(2) : '-'} /50
            &nbsp;·&nbsp; ดึงเมื่อ ${dateStr}${x.pulledBy ? ' โดย '+escapeHtml(displayNameForEmail(x.pulledBy)) : ''}
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <a class="back-link" style="margin:0;" href="${NATIONAL_URL}" target="_blank">ไปดูสถานะปัจจุบัน →</a>
          <a class="back-link" style="margin:0;color:var(--red);" data-unlink="${x.regionalWorkId}">ยกเลิกการเชื่อมโยง</a>
        </div>
      </div>`;
    }).join('');

  wrap.querySelectorAll('a[data-unlink]').forEach(a=>{
    let confirming = false;
    let revertTimer = null;
    a.onclick = async (e)=>{
      e.preventDefault();
      if(!confirming){
        confirming = true;
        a.textContent = 'ยืนยันการยกเลิก? (จะลบผลงานออกจากกลุ่มประเทศด้วย)';
        revertTimer = setTimeout(()=>{ confirming = false; a.textContent = 'ยกเลิกการเชื่อมโยง'; }, 4000);
        return;
      }
      clearTimeout(revertTimer);
      a.textContent = 'กำลังยกเลิก...';
      const regionalWorkId = a.dataset.unlink;
      const entry = linkageEntriesCache.find(x=>x.regionalWorkId===regionalWorkId);
      try{
        // ลบผลงานออกจากกลุ่มประเทศปลายทางด้วย ไม่ใช่แค่ลบทะเบียน — กันไม่ให้ผลงาน
        // ค้างอยู่ในกลุ่มประเทศทั้งที่ทะเบียนบอกว่ายกเลิกแล้ว (ตรงกับ self-healing ที่ออกแบบไว้)
        if(entry){
          const worksKey = `national:works:${entry.nationalGroupId}`;
          const r = await kvGet(worksKey);
          const works = r ? JSON.parse(r.value) : [];
          const newWorks = works.filter(w=>w.pulledFromRegionalWorkId!==regionalWorkId);
          await kvSet(worksKey, JSON.stringify(newWorks));
        }
        const idx = await loadRegionalPullIndexForInspection();
        delete idx[regionalWorkId];
        await saveRegionalPullIndexForInspection(idx);
        await renderLinkageInspectionPanel();
      }catch(err){
        a.textContent = 'ยกเลิกไม่สำเร็จ กรุณาลองใหม่';
        setTimeout(()=>{ a.textContent = 'ยกเลิกการเชื่อมโยง'; confirming = false; }, 2500);
      }
    };
  });
}

/* ===================== auth state ===================== */
fsAuth.onAuthStateChanged(async (user)=>{
  if(!user){
    currentUser = null;
    renderLogin();
    return;
  }
  currentUser = user;
  root.innerHTML = '<div class="card" style="text-align:center;">กำลังโหลด...</div>';
  [superAdmins, permissions, usernameMap] = await Promise.all([loadLandingSuperAdmins(), loadLandingPermissions(), loadLandingUsernameMap()]);
  renderMenu();
});
</script>
